name: Build actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: |
          mkdir -p coverage
          sudo chown -R 1000:1000 coverage
          docker compose -f docker-compose.build.yml build dev
          docker compose -f docker-compose.build.yml run --rm -v "$PWD"/coverage:/tmp/coverage dev sh -c "pnpm run test && cp -a /usr/app/coverage/. /tmp/coverage/"
      - name: Install deps for codecov
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends gpg
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_ORG_TOKEN }}

  typecheck:
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Typecheck
        env:
          VERSION: main
        run: |
          docker compose -f docker-compose.build.yml build dev
          docker compose -f docker-compose.build.yml run dev sh -c "pnpm run typecheck"

  docker-build-main:
    runs-on: ubuntu-26.04
    needs:
      - typecheck
    steps:
      - uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        env:
          VERSION: main
        run: |
          docker compose -f docker-compose.build.yml build bank
          docker compose -f docker-compose.build.yml build miner
          docker compose -f docker-compose.build.yml push bank
          docker compose -f docker-compose.build.yml push miner
